<!DOCTYPE html>
<html>
<head>
    <title>Linking to LadgerBridge...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f6f8; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #008060; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Finalizing Connection</h2>
        <p>Redirecting you back to the app...</p>
        <p><a id="manual-link" style="color: #008060; text-decoration: none; font-weight: bold;">Click here if not redirected</a></p>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Build the custom scheme URL
        const appUrl = 'ledgerbridge://callback?' + urlParams.toString();
        
        document.getElementById('manual-link').href = appUrl;
        // Attempt automatic redirect
        window.location.href = appUrl;
        
        // Safety: If it hasn't redirected in 3 seconds, maybe user closed the app, stay on page.
    </script>
</body>
</html>
