<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Society | CoSphere</title>
    <style>
        :root {
            --primary: #6366f1;
            /* Replace with your primary color code */
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            padding: 2rem;
            background: var(--surface);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-sub);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">CoSphere</div>
        <h1>Almost there!</h1>
        <p>Scanning a society code? You'll need the CoSphere app to join and participate in the community.</p>

        <a id="openButton" href="#" class="btn">Open in CoSphere</a>

        <div class="footer">
            Don't have the app? <br>
            <a href="#" style="color: var(--primary); text-decoration: none;">Download from Store</a>
        </div>
    </div>

    <script>
        // Extract parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('v');
        const societyId = urlParams.get('id');

        // Construct custom scheme URL
        const customUrl = `cosphere://join/${societyId || ''}?v=${code || ''}`;

        // Update button
        const btn = document.getElementById('openButton');
        btn.href = customUrl;

        // Auto-redirect attempt:
        // Native App Links should have already intercepted, 
        // but if not, we wait 1 second and try the custom scheme.
        setTimeout(() => {
            window.location.href = customUrl;
        }, 1000);
    </script>
</body>

</html>
