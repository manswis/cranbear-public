<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Society | CoSphere</title>
<style>
:root {
--primary: #6366f1;
--primary-dark: #4f46e5;
--primary-light: #818cf8;
}

/* Light mode (default) */
:root {
--bg-start: #f8fafc;
--bg-end: #e2e8f0;
--surface: #ffffff;
--text: #0f172a;
--text-sub: #475569;
--border: #e2e8f0;
--shadow: rgba(0, 0, 0, 0.1);
--shadow-strong: rgba(0, 0, 0, 0.15);
--logo-shadow: rgba(99, 102, 241, 0.2);
--btn-shadow: rgba(99, 102, 241, 0.3);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
:root {
--bg-start: #0f172a;
--bg-end: #1e293b;
--surface: #1e293b;
--text: #f8fafc;
--text-sub: #94a3b8;
--border: #334155;
--shadow: rgba(0, 0, 0, 0.4);
--shadow-strong: rgba(0, 0, 0, 0.6);
--logo-shadow: rgba(99, 102, 241, 0.3);
--btn-shadow: rgba(99, 102, 241, 0.4);
}
}

* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 1rem;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
color: var(--text);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
text-align: center;
-webkit-font-smoothing: antialiased;
transition: background 0.3s ease, color 0.3s ease;
}

.container {
width: 100%;
max-width: 420px;
padding: 2rem 1.5rem;
background: var(--surface);
border-radius: 1.25rem;
box-shadow: 0 20px 40px var(--shadow);
border: 1px solid var(--border);
animation: slideUp 0.4s ease-out;
transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

@keyframes slideUp {
from {
opacity: 0;
transform: translateY(20px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.logo-container {
margin-bottom: 2rem;
}

.logo {
display: inline-flex;
align-items: center;
justify-content: center;
width: 64px;
height: 64px;
background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
border-radius: 1rem;
font-size: 1.75rem;
font-weight: 800;
color: white;
margin-bottom: 1rem;
box-shadow: 0 8px 16px var(--logo-shadow);
}

.logo-text {
font-size: 1.5rem;
font-weight: 700;
color: var(--text);
transition: color 0.3s ease;
}

h1 {
font-size: 1.75rem;
font-weight: 700;
margin: 0 0 0.75rem 0;
line-height: 1.2;
color: var(--text);
transition: color 0.3s ease;
}

p {
color: var(--text-sub);
margin: 0 0 2rem 0;
line-height: 1.6;
font-size: 1rem;
transition: color 0.3s ease;
}

.btn {
display: block;
background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
color: white;
padding: 1rem 2rem;
border-radius: 0.75rem;
text-decoration: none;
font-weight: 600;
font-size: 1rem;
transition: all 0.2s ease;
width: 100%;
border: none;
cursor: pointer;
box-shadow: 0 4px 12px var(--btn-shadow);
position: relative;
overflow: hidden;
}

.btn::before {
content: '';
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
opacity: 0;
transition: opacity 0.2s ease;
}

.btn:hover::before {
opacity: 1;
}

.btn:active {
transform: scale(0.98);
box-shadow: 0 2px 8px var(--btn-shadow);
}

.divider {
display: flex;
align-items: center;
margin: 2rem 0 1.5rem 0;
color: var(--text-sub);
font-size: 0.875rem;
transition: color 0.3s ease;
}

.divider::before,
.divider::after {
content: '';
flex: 1;
height: 1px;
background: var(--border);
transition: background 0.3s ease;
}

.divider::before {
margin-right: 1rem;
}

.divider::after {
margin-left: 1rem;
}

.footer {
font-size: 0.9375rem;
color: var(--text-sub);
line-height: 1.6;
transition: color 0.3s ease;
}

.footer a {
color: var(--primary);
text-decoration: none;
font-weight: 600;
transition: color 0.2s ease;
}

.footer a:hover {
color: var(--primary-dark);
text-decoration: underline;
}

.icon {
display: inline-block;
width: 20px;
height: 20px;
margin-right: 8px;
vertical-align: middle;
}

/* Mobile optimizations */
@media (max-width: 480px) {
body {
padding: 0.75rem;
}

.container {
padding: 1.75rem 1.25rem;
border-radius: 1rem;
}

h1 {
font-size: 1.5rem;
}

p {
font-size: 0.9375rem;
}

.btn {
padding: 0.875rem 1.5rem;
font-size: 0.9375rem;
}

.logo {
width: 56px;
height: 56px;
font-size: 1.5rem;
}

.logo-text {
font-size: 1.25rem;
}
}

/* Landscape mobile */
@media (max-height: 600px) and (orientation: landscape) {
body {
min-height: auto;
padding: 1rem;
}

.container {
padding: 1.5rem;
margin: 1rem auto;
}

h1 {
font-size: 1.35rem;
margin-bottom: 0.5rem;
}

p {
margin-bottom: 1.25rem;
}

.logo-container {
margin-bottom: 1rem;
}

.divider {
margin: 1.25rem 0 1rem 0;
}
}

/* Tablet adjustments */
@media (min-width: 768px) {
.container {
padding: 2.5rem 2rem;
}

h1 {
font-size: 2rem;
}
}
</style>
</head>
<body>
<div class="container">
<div class="logo-container">
<div class="logo">C</div>
<div class="logo-text">CoSphere</div>
</div>
<h1>Almost there!</h1>
<p>Scanning a society code? You'll need the CoSphere app to join and participate in the community.</p>
<a id="openButton" href="#" class="btn">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
<path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
</svg>
Open in CoSphere
</a>
<div class="divider">or</div>
<div class="footer">
Don't have the app?<br>
<a href="#" id="downloadLink">Download from Store</a>
</div>
</div>
<script>
// Extract parameters from URL
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('v');
const societyId = urlParams.get('id');

// Construct custom scheme URL
const customUrl = `cosphere://join/${societyId || ''}?v=${code || ''}`;

// Update button
const btn = document.getElementById('openButton');
btn.href = customUrl;

// Detect platform and set appropriate download link
const downloadLink = document.getElementById('downloadLink');
const userAgent = navigator.userAgent || navigator.vendor || window.opera;

if (/android/i.test(userAgent)) {
downloadLink.href = 'https://play.google.com/store/apps/details?id=com.cosphere.app';
downloadLink.textContent = 'Download from Play Store';
} else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
downloadLink.href = 'https://apps.apple.com/app/cosphere/id123456789';
downloadLink.textContent = 'Download from App Store';
} else {
downloadLink.href = 'https://cosphere.app/download';
downloadLink.textContent = 'Download CoSphere';
}

// Auto-redirect attempt
setTimeout(() => {
window.location.href = customUrl;
}, 1000);
</script>
</body>
</html>
