<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Society | CoSphere</title>
<style>
:root {
--primary: #6366f1;
--primary-dark: #4f46e5;
--primary-light: #818cf8;
--accent: #8b5cf6;
}

/* Light mode (default) */
:root {
--bg: #ffffff;
--surface: #ffffff;
--surface-elevated: #f8fafc;
--text: #0f172a;
--text-secondary: #64748b;
--text-tertiary: #94a3b8;
--border: #e2e8f0;
--border-strong: #cbd5e1;
--shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
--shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
--shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
--glow: rgba(99, 102, 241, 0.15);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
:root {
--bg: #0a0a0a;
--surface: #121212;
--surface-elevated: #1e1e1e;
--text: #ffffff;
--text-secondary: #a1a1aa;
--text-tertiary: #71717a;
--border: #27272a;
--border-strong: #3f3f46;
--shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
--shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.4);
--shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 10px 10px -5px rgba(0, 0, 0, 0.5);
--glow: rgba(99, 102, 241, 0.25);
}
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 1rem;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
transition: background-color 0.3s ease;
}

.wrapper {
width: 100%;
max-width: 440px;
}

.card {
background: var(--surface);
border-radius: 24px;
padding: 3rem 2rem;
box-shadow: var(--shadow-xl);
border: 1px solid var(--border);
position: relative;
overflow: hidden;
transition: all 0.3s ease;
}

.card::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
height: 4px;
background: linear-gradient(90deg, var(--primary), var(--accent));
}

/* Floating orbs background effect */
.orb {
position: absolute;
border-radius: 50%;
filter: blur(60px);
opacity: 0.15;
pointer-events: none;
z-index: 0;
}

.orb-1 {
width: 300px;
height: 300px;
background: var(--primary);
top: -150px;
right: -100px;
animation: float 20s ease-in-out infinite;
}

.orb-2 {
width: 250px;
height: 250px;
background: var(--accent);
bottom: -100px;
left: -80px;
animation: float 15s ease-in-out infinite reverse;
}

@keyframes float {
0%, 100% { transform: translate(0, 0) scale(1); }
33% { transform: translate(30px, -30px) scale(1.1); }
66% { transform: translate(-20px, 20px) scale(0.9); }
}

.content {
position: relative;
z-index: 1;
}

.header {
text-align: center;
margin-bottom: 2.5rem;
}

.logo-wrapper {
display: inline-flex;
align-items: center;
gap: 0.75rem;
margin-bottom: 2rem;
padding: 0.5rem 1.25rem;
background: var(--surface-elevated);
border-radius: 100px;
border: 1px solid var(--border);
box-shadow: var(--shadow-sm);
}

.logo-icon {
width: 32px;
height: 32px;
background: linear-gradient(135deg, var(--primary), var(--accent));
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 1rem;
color: white;
box-shadow: 0 4px 12px var(--glow);
}

.logo-text {
font-size: 1.125rem;
font-weight: 600;
color: var(--text);
letter-spacing: -0.02em;
}

h1 {
font-size: 2rem;
font-weight: 700;
color: var(--text);
margin-bottom: 0.75rem;
letter-spacing: -0.03em;
line-height: 1.2;
}

.subtitle {
font-size: 1.0625rem;
color: var(--text-secondary);
line-height: 1.6;
max-width: 90%;
margin: 0 auto;
}

.actions {
margin-top: 2.5rem;
display: flex;
flex-direction: column;
gap: 1rem;
}

.btn {
display: flex;
align-items: center;
justify-content: center;
gap: 0.625rem;
padding: 1rem 1.75rem;
border-radius: 14px;
font-size: 1rem;
font-weight: 600;
text-decoration: none;
border: none;
cursor: pointer;
transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
position: relative;
overflow: hidden;
}

.btn-primary {
background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
color: white;
box-shadow: 0 4px 16px var(--glow), var(--shadow-md);
}

.btn-primary::before {
content: '';
position: absolute;
inset: 0;
background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
opacity: 0;
transition: opacity 0.2s ease;
}

.btn-primary:hover {
transform: translateY(-2px);
box-shadow: 0 8px 24px var(--glow), var(--shadow-lg);
}

.btn-primary:hover::before {
opacity: 1;
}

.btn-primary:active {
transform: translateY(0);
}

.btn-secondary {
background: var(--surface-elevated);
color: var(--text);
border: 1.5px solid var(--border-strong);
box-shadow: var(--shadow-sm);
}

.btn-secondary:hover {
background: var(--border);
border-color: var(--border-strong);
transform: translateY(-1px);
box-shadow: var(--shadow-md);
}

.btn-secondary:active {
transform: translateY(0);
}

.icon {
width: 20px;
height: 20px;
flex-shrink: 0;
}

.divider {
display: flex;
align-items: center;
margin: 2rem 0;
}

.divider-line {
flex: 1;
height: 1px;
background: var(--border);
}

.divider-text {
padding: 0 1rem;
font-size: 0.8125rem;
color: var(--text-tertiary);
font-weight: 500;
text-transform: uppercase;
letter-spacing: 0.05em;
}

.info-box {
background: var(--surface-elevated);
border: 1px solid var(--border);
border-radius: 16px;
padding: 1.25rem;
margin-top: 1.5rem;
}

.info-title {
font-size: 0.875rem;
font-weight: 600;
color: var(--text);
margin-bottom: 0.5rem;
display: flex;
align-items: center;
gap: 0.5rem;
}

.info-text {
font-size: 0.875rem;
color: var(--text-secondary);
line-height: 1.5;
}

.info-text a {
color: var(--primary);
text-decoration: none;
font-weight: 600;
transition: color 0.2s ease;
}

.info-text a:hover {
color: var(--primary-dark);
text-decoration: underline;
}

.badge {
display: inline-flex;
align-items: center;
gap: 0.375rem;
padding: 0.375rem 0.75rem;
background: rgba(99, 102, 241, 0.1);
color: var(--primary);
border-radius: 100px;
font-size: 0.8125rem;
font-weight: 600;
margin-bottom: 1rem;
border: 1px solid rgba(99, 102, 241, 0.2);
}

.pulse-dot {
width: 6px;
height: 6px;
background: var(--primary);
border-radius: 50%;
animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
0%, 100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.5; transform: scale(0.8); }
}

/* Mobile optimizations */
@media (max-width: 480px) {
.card {
padding: 2rem 1.5rem;
border-radius: 20px;
}

h1 {
font-size: 1.75rem;
}

.subtitle {
font-size: 1rem;
max-width: 100%;
}

.logo-wrapper {
gap: 0.5rem;
padding: 0.375rem 1rem;
}

.logo-icon {
width: 28px;
height: 28px;
font-size: 0.875rem;
}

.logo-text {
font-size: 1rem;
}

.btn {
padding: 0.875rem 1.5rem;
font-size: 0.9375rem;
}

.info-box {
padding: 1rem;
}
}

/* Tablet and up */
@media (min-width: 768px) {
.card:hover {
transform: translateY(-4px);
box-shadow: var(--shadow-xl), 0 0 0 1px var(--border);
}
}

/* Landscape mobile */
@media (max-height: 650px) and (orientation: landscape) {
.card {
padding: 1.5rem;
}

.header {
margin-bottom: 1.5rem;
}

h1 {
font-size: 1.5rem;
margin-bottom: 0.5rem;
}

.logo-wrapper {
margin-bottom: 1rem;
}

.actions {
margin-top: 1.5rem;
}

.info-box {
margin-top: 1rem;
}
}
</style>
</head>
<body>
<div class="wrapper">
<div class="card">
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="content">
<div class="header">
<div class="logo-wrapper">
<div class="logo-icon">C</div>
<span class="logo-text">CoSphere</span>
</div>
<div class="badge">
<span class="pulse-dot"></span>
<span>Society Invite</span>
</div>
<h1>Search your society!</h1>
<p class="subtitle">Open the CoSphere app to join this community and start connecting with members.</p>
</div>

<div class="actions">
<a href="#" id="openButton" class="btn btn-primary">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
<polyline points="15 3 21 3 21 9"/>
<line x1="10" y1="14" x2="21" y2="3"/>
</svg>
Open in CoSphere
</a>
</div>

<div class="divider">
<div class="divider-line"></div>
<span class="divider-text">New here?</span>
<div class="divider-line"></div>
</div>

<div class="info-box">
<div class="info-title">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10"/>
<path d="M12 16v-4"/>
<path d="M12 8h.01"/>
</svg>
Don't have the app?
</div>
<p class="info-text">
Download CoSphere from the <a href="#" id="downloadLink">App Store</a> to get started.
</p>
</div>
</div>
</div>
</div>

<script>
// Extract parameters from URL
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('v');
const societyId = urlParams.get('id');

// Construct custom scheme URL
const customUrl = `cosphere://join/${societyId || ''}?v=${code || ''}`;

// Update button
const btn = document.getElementById('openButton');
btn.href = customUrl;

// Detect platform and set appropriate download link
const downloadLink = document.getElementById('downloadLink');
const userAgent = navigator.userAgent || navigator.vendor || window.opera;

if (/android/i.test(userAgent)) {
downloadLink.href = 'https://play.google.com/store/apps/details?id=com.cosphere.app';
downloadLink.textContent = 'Play Store';
} else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
downloadLink.href = 'https://apps.apple.com/app/cosphere/id123456789';
downloadLink.textContent = 'App Store';
} else {
downloadLink.href = 'https://cosphere.app/download';
downloadLink.textContent = 'App Store or Play Store';
}

// Auto-redirect attempt
setTimeout(() => {
window.location.href = customUrl;
}, 1000);
</script>
</body>
</html>
