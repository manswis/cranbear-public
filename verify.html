<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Email...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            /* Apple-like grey */
            color: #1d1d1f;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #86868b;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #007aff;
            color: white;
            text-decoration: none;
            border-radius: 980px;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container" id="loading">
        <h1>Verifying...</h1>
        <p>Please wait while we verify your email address.</p>
    </div>

    <div class="container hidden" id="success">
        <h1>Email Verified! ✅</h1>
        <p>Your email has been successfully verified.</p>
        <p>You can now return to the application.</p>
    </div>

    <div class="container hidden" id="error">
        <h1>Something went wrong</h1>
        <p id="error-msg">We couldn't verify your email.</p>
        <p>Please try opening the link again on your mobile device.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script>
        const client = new Appwrite.Client();
        const account = new Appwrite.Account(client);

        // TODO: Replace with your actual Project ID and Endpoint
        client
            .setEndpoint('https://cloud.appwrite.io/v1')
            .setProject('66a63d2200267a45127c');

        const urlParams = new URLSearchParams(window.location.search);
        const secret = urlParams.get('secret');
        const userId = urlParams.get('userId');

        if (secret && userId) {
            account.updateVerification(userId, secret)
                .then(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('success').classList.remove('hidden');
                })
                .catch((error) => {
                    console.error(error);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error').classList.remove('hidden');
                    document.getElementById('error-msg').innerText = error.message;
                });
        } else {
            // Just visiting the page without params
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error-msg').innerText = "Invalid verification link. Missing parameters.";
        }
    </script>
</body>

</html>
